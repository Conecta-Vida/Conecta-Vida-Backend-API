spring.application.name=conectaavida-api
server.port=8080

# Banco externo Supabase/PostgreSQL: credenciais injetadas pelo ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false
spring.jpa.open-in-view=true

# SMTP: dados sensíveis fornecidos em tempo de execução.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*

# Segredo da aplicação deve ser definido no ambiente, sem valor padrão versionado.
app.security.salt=${CONECTA_API_SALT}
app.security.allowed-origins=${CONECTA_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:4000,http://localhost}
fcm.server.key=${FCM_SERVER_KEY:}
